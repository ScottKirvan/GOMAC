name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: GOMAC
      project_context: "GOMAC (Gomtuu Automatic Computer) is an AI-powered automation, logistics, and telemetry hub for Gomtuu, a 2005 T1N Sprinter van — a personal LCARS-inspired compute interface for vanlife travel across North America."
      header: |
        ## GOMAC

        > The computer that runs Gomtuu.

        ---
      footer: |
        ---
        📖 [User Guide](https://ScottKirvan.github.io/GOMAC/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/GOMAC/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/GOMAC/issues/new?template=feature_request.md)
      changelog_path: "notes/CHANGELOG.md"
    secrets: inherit
