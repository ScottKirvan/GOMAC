[project]
name = "gomac-pandora-ha"
version = "0.1.0"
description = "Home Assistant custom integration: a media_player entity for the pianobar MQTT bridge daemon."
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-homeassistant-custom-component",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
